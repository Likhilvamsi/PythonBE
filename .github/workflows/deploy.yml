name: Build and Deploy FastAPI Backend to AKS

on:
  push:
    branches:
      - main

env:
  REGISTRY_NAME: deploy01
  IMAGE_NAME: fastapi-backend
  CLUSTER_NAME: Devopscluster
  RESOURCE_GROUP: ACK

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Login to Azure using Service Principal
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Step 3: Login to Azure Container Registry
      - name: Azure ACR Login
        run: |
          az acr login --name ${{ env.REGISTRY_NAME }}

      # Step 4: Build and push Docker image
      - name: Build and Push Docker Image to ACR
        run: |
          IMAGE_TAG=${{ github.sha }}
          docker build -t ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:$IMAGE_TAG .
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:$IMAGE_TAG
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # Step 5: Get AKS credentials
      - name: Get AKS credentials
        run: |
          az aks get-credentials --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.CLUSTER_NAME }} --overwrite-existing

      # Step 6: Update Kubernetes manifests (image tag)
      - name: Set image tag in Kubernetes manifests
        run: |
          sed -i "s|image: .*|image: ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}|" k8s/deployment.yaml

      # Step 7: Deploy to AKS
      - name: Deploy to AKS
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      # Step 8: Verify deployment
      - name: Verify Deployment
        run: |
          kubectl get pods -o wide
          kubectl get svc fastapi-backend-service
